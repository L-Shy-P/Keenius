[project]
name = "openteacher"
version = "0.1.0"
description = "CLI AI Teacher for efficient self-learning"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.scripts]
openteacher = "openteacher.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[tool.setuptools.packages.find]
include = ["openteacher*"]

[tool.ruff]
line-length = 100
